
[tag_filter_bus]
	#特大号标签过滤总线UI每页显示的槽位数
	#Range: 1 ~ 256
	slotsPerPage = 16
	#特大号标签过滤总线最大页数
	#Range: 1 ~ 1000
	maxPages = 50
	#特大号标签过滤总线最大拉取种类数（配置槽位总数）
	#Range: 1 ~ 256
	slotsCount = 32

[maintenance_hatch]
	#山海维护仓是否生效（设为 false 可禁用绕过功能，但维护仓仍可放置）
	enabled = true

[parallel_override]
	#并行覆写模式：false=精准覆写（仅对已知机器类生效，默认），true=全面覆写（尝试覆写所有机器）
	#开启全面覆写后，可突破纳米核心(gtceu:nano_core)等机器内部的8192并行限制
	forceMode = false

[hub_parallel_behavior]
	#枢纽并行/线程值是否作为产出倍率（默认禁用=普通并行方案）
	#false=禁用枢纽并行/线程倍率产出，枢纽仅提供电压绕过和维护功能
	#true=启用枢纽并行/线程值作为产出倍率（原行为）
	outputMultiplier = false

[super_parallel]
	#寰宇并行超限器——配方倍率补偿系数（默认 1.0）
	#1.0 = 每个配方独立 Long.MAX_VALUE 并行
	#>1.0 = 在 getMaxParallel 结果上乘此系数（超越枢纽/引力波倍率）
	#建议范围 1.0 ~ 1.0E12
	#Range: 1.0 ~ 1.0E15
	multiplier = 1.0

[nine_industrial]
	#大明科技全配方模式
	#true=每大类聚合搜索该大类下全部子配方类型
	#false=仅搜索当前大类的主配方类型（性能更好）
	fullMode = true

[module_independence]
	#模块机器是否可脱离主机独立运行（默认禁用）
	#false=模块必须有主机才能运行
	#true=模块脱离主机后可独立运行配方
	workWithoutHost = false

[coin_forge]
	#禁用原初铸币工厂（默认关闭）
	#false=正常注册机器，并加载 coin_forge 配方
	#true=不注册 gt_shanhai:primordial_coin_forge，加载后移除 coin_forge 配方以及产出该机器的配方
	#修改后需要重启游戏/服务端。已放置的铸币工厂会因方块未注册而丢失
	disabled = false

[primordial_series]
	#禁用原初系列机器（默认关闭）
	#只禁用全部配方类型都来自 gtceu / gtlcore / gtladditions 的原初模块；
	#例如原初临界加工模块（无 gt_shanhai 自建配方类型）。
	#任何带 gt_shanhai 自建配方类型的机器（如原初分歧发生器）不会被禁用，因为自写配方要用。
	#被动模块（质能核心、归墟彭罗斯遏制场）与主机本体（原始终焉引擎、归墟视界枢核）始终保留。
	#禁用语义：方块/物品仍注册，只从 GT 机器注册表移除，JEI 结构与催化物同步隐藏；已有存档不会损坏方块。
	#修改后需要重启游戏/服务端生效
	disabled = false

[recursive_reverse_array]
	#递归反演阵列是否破除已连接子模块的内部限制（默认禁用）
	#false=保持 GTLAdditions 原版逻辑：催化剂、聚焦材料、温度窗口、模块运行状态全部正常检查
	#true=仅当子模块已成型并连接到递归反演阵列时，将其视作满状态参与递归反演增益
	#该配置不会让脱离阵列独立运行的模块参与递归反演增益
	bypassModuleRestrictions = false

[me_disk_hatch]
	#ME 磁盘仓室的槽位数（默认 108）
	#修改后需重新放置仓室生效
	#Range: 1 ~ 256
	slots = 108

[primordial_omega_engine]
	#允许引擎无条件安装任意原初模块（默认关闭）
	#true=忽略 blockedModuleItemIds 宿主黑名单，原始终焉引擎可运行任意原初模块
	#false=黑名单内模块必须直接接入归墟视界枢核，或由归墟超维度链接模块接管所在引擎
	#本项只控制宿主准入；机器禁用、配方材料与其他运行条件仍由各自配置控制
	allowAnyPrimordialModule = true
	#原始终焉引擎不能运行的原初模块物品 ID 黑名单
	#填写完整 ID：命名空间:物品名，精确匹配；可自行新增、删除，空列表表示不限制任何模块
	#默认包含十种高阶原初模块；从列表删除 ID 后，该模块允许在普通引擎运行
	#受限模块仍可安装，但会停机并报错；已成型归墟直接挂载或超维度接管后可运行
	#allowAnyPrimordialModule=true 时本列表不生效；修改后最迟下一工作 tick 生效
	blockedModuleItemIds = ["gt_shanhai:primordial_weiyang_reconstruction_module", "gt_shanhai:primordial_shaoguang_aggregation_core", "gt_shanhai:primordial_eternal_smelting_furnace", "gt_shanhai:primordial_tianqiong_assembly_core", "gt_shanhai:primordial_universe_simulation_core", "gt_shanhai:primordial_quantum_distortion_matrix", "gt_shanhai:primordial_multidimensional_implosion_core", "gt_shanhai:primordial_supercritical_matter_generation_core", "gt_shanhai:primordial_causal_weaving_matrix", "gt_shanhai:primordial_singularity_inversion_core"]
	#原始终焉引擎中心球体的渲染风格覆盖（纯客户端显示偏好）
	#COMMON 配置不同步：多人环境下各玩家读自己本地的 gt_shanhai-common.toml，只影响自己的画面
	#FOLLOW_MACHINE = 跟随每台机器 GUI 侧栏的切换按钮（默认）
	#UNIVERSE = 强制全部渲染成鸿蒙微型宇宙，忽略机器上的设定
	#NEUTRON_STAR = 强制全部渲染成中子星，忽略机器上的设定
	#本项不改写机器的持久化状态，切回 FOLLOW_MACHINE 即恢复各机器原设定
	#Allowed Values: FOLLOW_MACHINE, UNIVERSE, NEUTRON_STAR
	sphereStyle = "FOLLOW_MACHINE"
	#原初模块是否启用旧式无限制模式（默认关闭）
	#false = 正常读取超净间、重力、维度、线圈温度和恒星热力容器等级限制
	#      研究/数据访问条件不作为原初模块的额外挂载限制
	#true = 兼容旧行为：除重力条件外，不检查超净间、维度、线圈温度和恒星热力容器等级
	unrestrictedMode = false

[virtual_item_provider]
	#虚拟物品提供器模式
	#AE_TARGET_CHECK = AE 下单检查网络中的真实目标物，执行时把 provider 解成目标物镜像；不依赖虚拟物品供应机
	#SUPPLY_MACHINE = AE 下单检查同网络虚拟物品供应机槽内是否存在目标物；供应机不向 AE 普通库存暴露 provider key
	#Allowed Values: AE_TARGET_CHECK, SUPPLY_MACHINE
	mode = "AE_TARGET_CHECK"
	#自动写样板时不包裹为虚拟物品提供器的物品 ID 列表
	#例：gtceu:programmed_circuit。被排除物品会按原物品直接写入样板，保留自身 NBT
	autoWrapExclusions = ["gtceu:programmed_circuit"]
	#编码时确认所选 GT 配方后，是否补回缺失的不消耗输入
	#true=按快速编码的候选优先级补回（默认）
	#false=保留玩家当前的输入选择
	forceWrapOmittedNonConsumables = true
	#样板编码时是否写入 gt_shanhai_recipe_id
	#true=编码和快速编码上传都写入精确配方 ID（默认）
	#false=两边都不写。已有样板上的旧 ID 不会被清掉
	encodeWriteRecipeId = true
	#样板编码时是否把不消耗输入写成虚拟物品供应器
	#true=按原有自动/强制包裹规则写入（默认）
	#false=编码和快速编码上传都保留原始物品或流体，不写虚拟供应器
	encodeWriteVirtualProvider = false

[recipe_type_pattern_buffer]
	#配方类型识别 ME 样板总成联动主机配方类型的模式
	#PROGRAMMABLE_HATCH_REQUIRED = 必须有山海可编程仓随主机成型，由可编程仓实际切换主机配方类型；无可编程仓时不运行虚拟类型样板
	#VIRTUAL_ACTIVE_TYPE = 不要求可编程仓；样板配方可直接加入宿主执行队列，默认仍要求宿主当前支持该配方类型
	#Allowed Values: PROGRAMMABLE_HATCH_REQUIRED, VIRTUAL_ACTIVE_TYPE
	switchMode = "VIRTUAL_ACTIVE_TYPE"
	#是否允许星律虚拟执行宿主当前不支持的配方类型（默认 false）
	#false = 样板配方类型必须存在于宿主 machine.getRecipeTypes()，否则不进入执行队列
	#true = ⚠ 作弊/破限兼容：保留旧行为，允许完整 GTRecipe 跨宿主配方类型虚拟直跑；可能绕过机器配方类型限制
	allowUnsupportedHostRecipeTypes = false
	#是否允许星律主动虚拟执行链破除宿主限制（默认 false）
	#false = 正常执行：AE 已下单槽位照常供料与执行；未下单槽位不会主动从 AE 网络预填原料；遵守宿主配方类型、并行、beforeWorking/part 等限制
	#true = ⚠ 作弊/破限兼容：允许未下单首配预填，并跳过宿主 beforeWorking/part 检查；可能绕过内部小机器槽、模式/维护等机器原生限制；普通耗材仍按宿主并行夹限
	#仅用于旧存档兼容或明确允许作弊的服务器；正常平衡环境请保持关闭
	allowCheatVirtualExecution = false
	#星律共享搜索集：每个条目是一组以逗号分隔的配方类型ID（需带命名空间），同组类型互相视为可共同搜索/执行
	#例："gtceu:chemical_reactor,gtceu:large_chemical_reactor" 表示化反样板可在大型化反宿主执行、反之亦然
	#生效范围：虚拟执行的宿主类型校验、配方类型选择集机器的选中校验、样板槽扣料的类型匹配
	#样板自身的配方解析仍按其编码类型域进行；与 allowUnsupportedHostRecipeTypes（全放开）相比这是按组精确授权
	#空列表 = 保持严格隔离
	sharedSearchSets = ["gtceu:chemical_reactor,gtceu:large_chemical_reactor"]
	#星律样板总成卡死告警延迟（秒）
	#样板槽收到 AE 下单原料后，若延迟结束时这些原料仍完整停留在该槽内，则向附近玩家与 AE 下单玩家广播
	#默认 10 秒，用于避开主机低并行/低吞吐刚开始吃料时的误报
	#Range: 1 ~ 3600
	stuckWarningSeconds = 10
	#星律样板总成 UI 每行样板槽位数（默认 10）
	#修改后重启生效：已放置的总成在下次区块加载时即采用新配置
	#调小会裁剪槽位——被裁槽位里的样板会掉落在机器位置，内部缓冲料无法保留，改小前请先清空高位槽
	#Range: 1 ~ 16
	patternsPerRow = 10
	#星律样板总成 UI 每页行数（默认 10）
	#生效方式与裁剪风险同 patternsPerRow
	#Range: 1 ~ 16
	rowsPerPage = 10
	#星律样板总成最大页数（默认 10）
	#总槽位 = patternsPerRow × rowsPerPage × maxPages，默认 10×10×10 = 1000
	#生效方式与裁剪风险同 patternsPerRow
	#Range: 1 ~ 64
	maxPages = 10
	#星律通配符样板槽每页格数（默认 10）
	#总槽位 = wildcardSlotsPerPage × wildcardMaxPages，默认 10×2 = 20
	#修改后重启生效：已放置的总成在下次区块加载时采用新配置
	#调大可继续追加每页槽位；调小会裁掉高位槽，里面的通配样板掉在机器位置，改小前请先清空
	#Range: 1 ~ 16
	wildcardSlotsPerPage = 10
	#星律通配符样板槽页数（默认 2）
	#调大页数即可继续追加槽位；生效方式与裁剪风险同 wildcardSlotsPerPage
	#Range: 1 ~ 64
	wildcardMaxPages = 2
	#样板虚拟供料（首配路径）单个样板槽位单次从无线 ME 网络真实提取的目标并行批量上限（默认 65536）
	#样板配方执行的并行数由这个批量与网络真实库存共同决定：取两者较小值，绝不会超过网络实际库存
	#调大能让单个样板槽位吃到更高并行/吞吐，调小更保守；不影响配方类型选择集本身的机器最大并行上限
	#Range: 1 ~ 9223372036854775807
	virtualSupplyBatchParallel = 65536

[advanced_pattern_box]
	#高级样板包装箱 UI 每行样板槽位数（默认 9）
	#总容量 = patternsPerRow × rowsPerPage × maxPages（默认 9×6×4 = 216）
	#Range: 1 ~ 16
	patternsPerRow = 9
	#高级样板包装箱 UI 每页行数（默认 6）
	#调大会撑高 GUI，小分辨率/大 GUI 缩放下可能超出屏幕，按自己屏幕权衡
	#Range: 1 ~ 8
	rowsPerPage = 6
	#高级样板包装箱最大页数（默认 4）
	#调大立即生效：下次打开/使用包装箱时按新容量扩容
	#调小不会丢样板：已存到高位槽的样板会把箱子实际槽位撑在原尺寸，直到这些槽被清空才缩回
	#Range: 1 ~ 64
	maxPages = 4

[pattern_buffer_toolkit]
	#样板总成工具箱剪贴板面板最多渲染的样板数（默认 270 = 9 列 × 30 行，面板内滚动查看）
	#只影响面板预览，不限制剪贴板实际容量：超出部分照常复制/剪切/套用，只是不在面板里画出来
	#每个预览格都是一个真实容器槽，开面板时要整份同步给客户端——
	#剪贴板动辄上千个样板，调太大会让开面板卡顿甚至撑爆数据包，慎调
	#Range: 9 ~ 2048
	previewLimit = 270

[shop]
	#山海商店：全局禁用商店（默认 false）
	#禁用后所有玩家（含 OP）均不能交易；OP 仍可通过 /shanhai shopwizard 重新启用
	disabled = false
	#山海商店：非 AE 模式下，单次购买货物总量 ≥ 此阈值时打包成超级磁盘阵列赠送（而非塞背包）
	#默认 1000。设很大则几乎总进背包；设 1 则任何购买都打包成 SDA
	#Range: 1 ~ 9223372036854775807
	sdaPackThreshold = 1000
	#山海商店：奖励表模式（自选/随机/全部/FTBQ）单次购买最多独立随机抽取的次数（超出部分留到下次购买）
	#⚠ 每次抽取都要单独跑一次随机数/聚合逻辑，且全部在服务端主线程同步跑完才返回——
	#调大后玩家真输入一个天文数字一次性购买，会让服务端主线程卡死甚至触发看门狗（watchdog）强制崩服。
	#上限开到 Long.MAX_VALUE 纯粹是不设防——调多大、会不会卡死/崩服，自己权衡自己兜底
	#（FTBQ 模式受 FTBQ 自身 API 的 int 参数限制，实际单次仍会夹到 Integer.MAX_VALUE）
	#Range: 1 ~ 9223372036854775807
	rewardRollCap = 1000000
	#山海商店：AE 模式下是否禁止把购买/兑换得到的物品注入 AE 网络（默认 false = 原行为，能注入就注入）
	#true = AE 模式只用来拉取材料付款/检索库存，购买完成后物品一律正常交付给玩家
	#（进背包，装不下或总量达标按 sdaPackThreshold 打包超级磁盘阵列——SDA 打包规则不受此项影响）
	aeDeliverDisabled = false
	#山海商店：AE 注入限额。单种物品本次交付数量低于此值时进背包，达到或超过才注入 AE
	#默认 64。极小数量塞进 AE 后还得再抽出来用，进背包更直接
	#设 1 等于旧行为：只要网络吃得下就注入。流体没有背包落点，不受此项影响
	#「AE 模式禁止注入」开启时本项不生效。整批已达 SDA 打包阈值时，没进 AE 的仍随整批打包
	#Range: 1 ~ 9223372036854775807
	aeInjectMin = 64
	#山海商店：将SDA直接注入磁盘仓室（默认 true）
	#开启后，兑换/购买得到的有内容 SDA、以及超限自动打包出的 SDA，会优先放入同一 AE 网络内可用的 ME 磁盘仓室并直接挂载存储
	#磁盘仓室必须与 FTBQ AE提交器或商店终端处在同一个 AE 网络；空 SDA 商品不会自动挂载
	sdaDirectDiskHatchInject = true
	#山海商店：出售商品能拿回买价的百分比（默认 70，即卖出价=买价×70%）
	#买卖价差防止「买了立刻卖回零损耗」的套利；100=无价差（等价旧行为）
	#Range: 1 ~ 100
	sellRatioPercent = 70
	#低阶货币兑星火的基础限售枚数，面值每升一档限额翻倍，每位玩家每个币种独立计数，0 = 禁止出售
	#Range: 0 ~ 9223372036854775807
	currencySaleLimit = 4096
	#低阶货币限售刷新周期（现实秒），从首次成功出售起算
	#Range: 1 ~ 9223372036854775
	currencySalePeriodSeconds = 180

[shop_bank]
	#山海商店银行：定期存款每小时计息基点（万分之N，默认 5 ≈ 0.05%/小时，约 1.2%/天）
	#线性单利，利息不滚入本金。按 System.currentTimeMillis() 惰性结算，无独立 tick 调度器
	#Range: 0 ~ 10000
	depositRateBpPerHour = 5
	#山海商店银行：贷款每小时计息基点（万分之N，默认 15 ≈ 0.15%/小时，约 3.6%/天）
	#刻意高于存款利率吃利差。还款先冲利息再冲本金。不做强制追讨或抵押没收
	#Range: 0 ~ 10000
	loanRateBpPerHour = 15
	#山海商店银行：阶段贷款额度的总上限（星火，默认 1亿）
	#未提交电压阶段不能借款；ULV 1000 星火，此后每阶 ×4，取阶段额度与本配置的较小值。
	#阶段沿用 currency_stages.json 的 stagePrefix；已配置的父阶段也必须提交。
	#已欠本金加利息占用额度；旧欠款超过当前阶段额度时保留欠款，停止追加放款。
	#Range: 0 ~ 9223372036854775807
	maxLoanSpark = 100000000
	#山海商店银行：贷款期限（小时，默认 24）
	#从这笔贷款开始起算。到期后只要本金或利息还在，就拒绝下一笔贷款，直到还清。
	#期限内追加借款不延后到期时间。还清后下一笔重新计期限。
	#Range: 1 ~ 8760
	loanTermHours = 24

[runtime_recipe_cache]
	#是否统计运行期配方查找缓存的 hit/miss/negativeHit/clear 次数（默认关闭）
	#仅用于排查缓存是否生效，不影响缓存本身的读写逻辑
	#关闭时计数器不自增，无额外开销；开启后用 /shanhai cache stats 查看统计
	diagnosticsEnabled = false

[kjs_recipe_library_cache]
	#是否启用 KJS 配方库启动期磁盘缓存优化（默认关闭）
	#警告：开启此功能存在风险，一般仅用于开发环境加快游戏进入进程
	#正常游玩或生产环境不建议开启；关闭时完整使用 KubeJS/Rhino 原始配方注册与原版配方库
	#修改后需重启游戏或服务端生效
	enabled = false

[ae_storage_delta_cache]
	#AE 网络库存增量刷新缓存优化（默认开启）
	#true=仅当 NetworkStorage.insert/extract 记录到库存变化时才做全量重扫，其余 tick 跳过重扫（性能更好）
	#false=关闭该优化，每次都强制全量重扫库存，保证 ME 输出仓室返回、取出物品、取出磁盘等
	#不经过 insert/extract 记录路径的变化也能被及时刷新（性能开销恢复为未优化前水平）
	enabled = true
	#强制全量重扫安全网间隔（tick，默认 40 = 2 秒，仅在 enabled=true 时生效）
	#存储总线背后的外部容器（箱子/机器）被管道、漏斗、玩家直接改动时，
	#不经过 AE 的 insert/extract 记录路径，增量缓存无法感知——原版 AE2 靠每 tick 全扫兜底
	#此安全网保证这类变化最迟 N tick 内被看见，把陈旧窗口从无界压到有界
	#Range: 10 ~ 1200
	forceRescanTicks = 40

[jei]
	#JEI 配方侧边收藏按键的筛选模式
	#MISSING_ITEMS = 收藏当前配方中 AE 网络存储数量低于单次需求量的输入物品或流体
	#NO_RECIPE_ITEMS = 收藏当前配方中 AE 网络没有对应样板合成流程的输入物品或流体
	#COMBINED = 组合数量与 AE 样板流程判断：仅在无主产物样板且数量不足时收藏；数量极高时视为足够
	#Allowed Values: MISSING_ITEMS, NO_RECIPE_ITEMS, COMBINED
	bookmarkMode = "MISSING_ITEMS"
	#被排除的配方收藏物
	#每行一个物品。只写物品 ID 时，该物品不论 NBT 都拒绝收藏
	#写成 物品ID{SNBT} 时，物品 ID 相同且 NBT 包含这些键值才拒绝
	#字符串值写成 "*" 表示这个键存在且内容非空
	#也接受 Item.of('物品ID', '{SNBT}')
	#例：gtceu:data_module
	#例：gtceu:data_stick{assembly_line_research:{research_id:"*"}}
	#保存后下一次点收藏即生效。这是本机配置，会随收藏请求发给当前服务器
	bookmarkExclusions = ["gtceu:data_module", "gtceu:data_orb{assembly_line_research:{research_id:\"*\"}}", "gtceu:data_stick{assembly_line_research:{research_id:\"*\"}}"]

[developer]
	#开发模式（默认关闭）
	#false = 配方修改器导出 json 仍写到游戏目录 kubejs/data/Exported_Recipe/
	#true = 直接写入 C:/Users/dishanhai/Desktop/gt_shanhai/src/main/resources/data/gt_shanhai/recipes/
	#文件落在配方 id 的路径上，例如 gt_shanhai:qft/foo → recipes/qft/foo.json
	#只在这台开发机打开。其他机器没有这个目录，导出会失败。
	developerMode = false
	#开发者导出：GT 物品与流体清单（默认关闭）
	#开启后服务器启动完成时写出 config/gt_shanhai/dev-export/gt-contents.md
	#只收录 gtceu / kubejs / gtlcore / gtladditions / gt_shanhai / dishanhai
	#按模组分组，组内按 ID 字母排序；列为中文名、英文 ID、前两个 tag
	#内容较大，只在需要查表时临时开启
	exportContents = false
	#开发者导出：GT 配方清单（默认关闭）
	#开启后服务器启动完成时写出 config/gt_shanhai/dev-export/gt-recipes.md
	#按配方 ID 的命名空间分组，组内按 ID 字母排序
	#列为配方 ID、机器类型、前两输入与前两输出（物品/流体合并计数）
	#内容较大，只在需要查配方时临时开启
	exportRecipes = false

